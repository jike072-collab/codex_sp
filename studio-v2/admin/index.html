<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shoe Ad Studio Admin</title>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <main class="admin-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Local Admin</p>
        <h1>供应商配置后台</h1>
        <p class="lede">API Key、供应商地址和模型名只在这里维护。普通五步工作台只读取是否已配置。</p>
      </div>
      <button id="refreshButton" type="button">重新同步</button>
    </header>

    <section class="notice" aria-live="polite">
      <strong>安全提示：</strong>
      页面不会显示完整 API Key。密钥输入框留空表示不修改，勾选清除表示删除本地保存的 key。
    </section>

    <form id="providerForm" class="provider-form">
      <div id="status" class="status">正在读取后端 schema...</div>
      <div id="providerGrid" class="provider-grid"></div>
      <div class="actions">
        <button type="submit">保存配置</button>
        <span id="saveState" class="save-state" aria-live="polite"></span>
      </div>
    </form>
  </main>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
